name: Community help question
description: Ask for help in ordinary language about a ChatGPT conversation/history loading problem
title: "[Help] "
labels: ["community-help"]
body:
  - type: markdown
    attributes:
      value: |
        This is an unofficial community project and cannot access your ChatGPT account. You do not need technical logs to ask for help. Never post passwords, tokens, cookies, email addresses, account/conversation/request IDs, IP addresses, precise locations, private chat content or private support correspondence. Do not repeatedly retry or generate load to complete this form.
  - type: dropdown
    id: symptom
    attributes:
      label: What best describes the problem?
      options:
        - A conversation will not open
        - Too many requests / HTTP 429
        - History or old chats are not loading
        - The chat is visible/searchable but will not open
        - Couldn't refresh messages
        - Resume stream unavailable
        - Repeated loading/retry
        - Something else
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: What do you see?
      description: Copy the error wording if safe, but do not include private conversation content.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Web browser
        - Windows desktop app
        - macOS desktop app
        - Android
        - iOS / iPadOS
        - Work / Project surface
        - Other / unknown
    validations:
      required: true
  - type: dropdown
    id: waiting
    attributes:
      label: Did normal waiting, without repeated retries, change the result?
      options:
        - Yes
        - No
        - Not checked / unknown
  - type: textarea
    id: question
    attributes:
      label: What would you like help understanding?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety
      options:
        - label: I removed private identifiers/secrets and did not deliberately generate repeated traffic or bypass rate limits.
          required: true
