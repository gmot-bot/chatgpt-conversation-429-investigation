name: Independent reproduction
about: Report independently observed evidence without publishing sensitive identifiers
labels: ["needs-evidence"]
body:
  - type: markdown
    attributes:
      value: "Do not publish account IDs, conversation IDs, request IDs, IP addresses, cookies, tokens, emails, precise locations, private support data or unrelated conversation content. Do not intentionally generate repeated failures or bypass rate limits."
  - type: dropdown
    id: evidence_class
    attributes:
      label: Evidence class
      description: Choose the strongest class directly supported by your evidence; do not infer a mechanism from symptoms alone.
      options:
        - S0 ? Related symptom report
        - S1 ? Independent symptom reproduction
        - S2 ? Independent conversation/history HTTP 429 reproduction
        - S3 ? Relevant recovery/refetch/retry/fan-out mechanism evidence
        - Hypothesis / analysis only
    validations:
      required: true
  - type: dropdown
    id: occurrence
    attributes:
      label: How did this occur?
      options:
        - Naturally during normal use
        - Passive observation after a naturally occurring failure
        - Safe manual reproduction without repeated retries or generated load
        - Other / explain below
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What did you observe?
      description: Describe the user-visible symptom, what remained visible/searchable, and the sequence of events. Use coarse/relative timing where possible.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and browser/app family
      placeholder: "Example: Windows + Chromium-based browser (coarse details only)"
    validations:
      required: true
  - type: dropdown
    id: http_status
    attributes:
      label: Was HTTP 429 directly observed on conversation/history retrieval?
      options:
        - Not inspected / not established
        - Yes ? HTTP 429 directly observed on the relevant retrieval path
        - No ? relevant retrieval request inspected and did not return 429
    validations:
      required: true
  - type: input
    id: retry_after
    attributes:
      label: Retry-After or equivalent backoff signal
      description: Report only the coarse value/header behaviour; do not include request IDs or other unique identifiers.
      placeholder: "Example: Retry-After present; 30 seconds / absent / not inspected"
  - type: textarea
    id: mechanism
    attributes:
      label: Realtime/recovery/refetch/retry/fan-out evidence, if directly observed
      description: State exactly what was observed and separate temporal correlation from causation. Leave blank if not inspected.
  - type: textarea
    id: cooldown
    attributes:
      label: What happened after activity stopped?
      description: If naturally observed, describe whether failures/recovery requests continued during an idle/cooldown period. Do not create traffic just to fill this field.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safe-observation confirmation
      options:
        - label: I removed unique personal/account/conversation/request/network identifiers and secrets.
          required: true
        - label: I did not intentionally generate repeated traffic, coordinate load, automate retries or bypass rate limits to create this report.
          required: true
        - label: I distinguish direct observations, external reports, inferences and hypotheses.
          required: true
